<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Trebuchet MS", sans-serif; background: #000; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;

  }

  #overlay p { margin: 6px 0 14px; font-size: 20px; max-width: 560px; }
  .btn {
    display: block; width: 330px; margin: 8px; padding: 16px 20px; font-size: 22px; font-weight: bold; cursor: pointer;
    border: none; border-radius: 12px; color: #fff; font-family: inherit;
  }
  .btn:hover { filter: brightness(1.15); transform: scale(1.03); }
  #b1 { background: #2e9e4f; } #b2 { background: #2878d6; } #b3 { background: #d68a28; } #bjoin { background: #00897b; } #bres { background: #8e44ad; }
  .row { margin: 6px; font-size: 17px; }
  .row input { font-size: 17px; padding: 6px 10px; border-radius: 8px; border: none; width: 140px; text-align: center; }
  .sm { padding: 8px 14px; margin: 3px; border-radius: 8px; border: 2px solid #fff6; background: #0006; color: #fff; font-size: 15px; cursor: pointer; font-family: inherit; }
  .sm.on { background: #2e9e4f; border-color: #fff; }
  #overlay { overflow-y: auto; justify-content: flex-start; padding: 2vh 0; }
  #hud { position: fixed; top: 16px; left: 0; right: 0; text-align: center; color: #fff; pointer-events: none; text-shadow: 0 2px 4px #000; }
  #task { font-size: 26px; font-weight: bold; }
  #score { font-size: 22px; margin-top: 4px; }
  #holding { position: fixed; bottom: 50px; left: 0; right: 0; text-align: center; color: #fff; font-size: 22px; text-shadow: 0 2px 4px #000; pointer-events: none; }
  #controls { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #ddd; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px #000; }

</style>

<script>
(function () {
  // tries a local three.min.js first (fast if you add one next to index.html), then two CDNs
  var urls = [
    'three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  var done = false, started = 0, t0 = Date.now();
  var msg = document.getElementById('loadmsg');
  var tick, failed = false;
  window.addEventListener('error', function (e) {
    if (!e.message) return; // ignore plain download failures (we try the next source)
    var t = 'Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '');
    var m = document.getElementById('loadmsg');
    if (m) { failed = true; m.textContent = t; return; }
    var b = document.getElementById('errbar');
    if (!b) { b = document.createElement('div'); b.id = 'errbar'; document.body.appendChild(b); }
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#b71c1c;color:#fff;padding:6px 10px;font:13px sans-serif;z-index:99';
    b.textContent = t;
  }, true);
  function run() {
    if (done) return; done = true;
    clearInterval(tick);
    if (msg) msg.textContent = 'Starting game...';
    setTimeout(function () {
      var m = document.getElementById('loadmsg');
      if (m && !failed) m.textContent = 'The game loaded but the menu did not appear. Press F12, open Console, and tell me the red text.';
    }, 4000);
    var s = document.createElement('script');
    s.textContent = document.getElementById('game').textContent;
    document.body.appendChild(s);
  }
  function start() {
    if (done || started >= urls.length) return;
    var s = document.createElement('script');
    s.src = urls[started++];
    s.onload = function () { if (window.THREE && window.THREE.Scene) run(); else start(); };
    s.onerror = start;
    document.head.appendChild(s);
  }
  tick = setInterval(function () {
    if (done || failed) return;
    var sec = Math.round((Date.now() - t0) / 1000);
    msg.textContent = 'Loading 3D engine... ' + sec + 's';
    if (sec > 0 && sec % 3 === 0) start(); // slow? also try the next source in parallel
    if (sec >= 20) msg.innerHTML = 'Still loading. Check your connection, then <a href="" style="color:#7CFC9A">reload</a>.';
  }, 1000);
  start();
})();
</script>

function binLabelTex(text, bg) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;

  g.fillStyle = '#' + bg.toString(16).padStart(6, '0'); g.fillRect(0, 0, 256, 128);

}
function addBin(type, x, z) {

  g.add(body, lid, sign);
  g.position.set(x, 0, z);
  binGroup.add(g);
  bins.push({ type, pos: new THREE.Vector3(x, 0, z) });

function B(geo, color) { // unlit bright material (for glowing things)
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
}
function part(parent, mesh, x, y, z) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

const labelCache = {};
function makeLabel(text, crazy) {
  const key = text + crazy;
  if (labelCache[key]) return labelCache[key].clone();
  const c = document.createElement('canvas'); c.width = 640; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = crazy ? 'rgba(90,40,0,0.85)' : 'rgba(0,0,0,0.65)';
  const r = 24;
  g.beginPath(); g.moveTo(r, 8); g.lineTo(640 - r, 8); g.quadraticCurveTo(632, 8, 632, r + 8);
  g.lineTo(632, 120 - r); g.quadraticCurveTo(632, 120, 640 - r, 120); g.lineTo(r, 120);
  g.quadraticCurveTo(8, 120, 8, 120 - r); g.lineTo(8, r + 8); g.quadraticCurveTo(8, 8, r, 8); g.fill();
  g.fillStyle = crazy ? '#ffd740' : '#ffffff';
  let size = 54;
  g.font = 'bold ' + size + 'px Arial';
  while (g.measureText(text).width > 590 && size > 20) { size -= 2; g.font = 'bold ' + size + 'px Arial'; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 320, 66);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sp.scale.set(3.2, 0.64, 1);
  labelCache[key] = sp;
  return sp.clone();
}

let itemSeq = 0, rng = Math.random;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function itemCat(d) { return d.crazy ? 'crazy' : (d.bin === 'ewaste' || d.bin === 'hazard') ? 'tech' : 'trash'; }

const overlay = document.getElementById('overlay');
const taskEl = document.getElementById('task');
const scoreEl = document.getElementById('score');
const holdEl = document.getElementById('holding');
const msgEl = document.getElementById('msg');

function flash(text, color) {
  msgEl.textContent = text; msgEl.style.color = color; msgEl.style.opacity = 1;
  clearTimeout(flash.t); flash.t = setTimeout(() => msgEl.style.opacity = 0, 1100);
}

function pickDef() {
  let i = Math.floor(rng() * ITEM_DEFS.length);
  if (ITEM_DEFS[i].crazy && rng() < 0.5) i = Math.floor(rng() * ITEM_DEFS.length);
  return i;
}

function spawnItem(data, announce) {
  data = data || { di: pickDef(), id: myId + '_' + (itemSeq++) };
  const def = ITEM_DEFS[data.di];
  const group = new THREE.Group();
  const body = new THREE.Group();
  def.build(body);
  group.add(body);
  const box = new THREE.Box3().setFromObject(body);
  const h = box.max.y;
  const label = makeLabel(def.name, !!def.crazy);
  label.position.y = h + 0.6;
  group.add(label);

  let x = data.x, z = data.z, tries = 0;
  if (x === undefined) {
    do {
      x = (rng() * 2 - 1) * (limit - 3);
      z = (rng() * 2 - 1) * (limit - 3);
      tries++;
    } while (mode === 1 && tries < 30 && bins.some(b => Math.hypot(b.pos.x - x, b.pos.z - z) < 5));
  }
  group.position.set(x, 0, z);
  body.rotation.y = (data.id.length * 1.7) % 6.28;
  scene.add(group);
  items.push({ def, group, body, label, h, id: data.id });
}

function clearItems() {
  items.forEach(it => scene.remove(it.group));
  items.length = 0;
  if (held) { camera.remove(held.group); held = null; }
}

function updateHUD() {
  if (mode === 1) {
    scoreEl.textContent = 'Score: ' + score;
    if (held) {
      holdEl.textContent = 'Holding: ' + held.def.name;
      taskEl.textContent = 'THIS GOES IN THE ' + BIN_TYPES[held.def.bin].label + '!';
    } else {
      holdEl.textContent = 'Empty Handed';
      taskEl.textContent = 'Find some trash!';
    }
  } else if (mode === 2) {
    taskEl.textContent = vacTypes[vacIdx].name + ' - sucks up ' + vacTypes[vacIdx].what + ' (keys 1/2/3 switch)';
    scoreEl.textContent = 'Score: ' + score + (timed ? '   |   Time: ' + Math.max(0, Math.ceil(timeLeft)) : '');
    holdEl.textContent = '';
  }
}

function startMode(m, t) {
  clearItems();
  mode = m; started = true; ended = false; score = 0; timeLeft = 60; vacOn = false;
  timed = !!t; vacIdx = 0; applyVac();
  camera.rotation.set(0, 0, 0);
  vy = 0;
  if (m === 1) {
    limit = 35;
    scene.background = new THREE.Color(0x9fd8ff);
    scene.fog = new THREE.Fog(0x9fd8ff, 30, 80);
    groundMat.color.set(0x4caf50);
    outdoor.visible = true; binGroup.visible = true; indoor.visible = false; vac.visible = false;
    camera.position.set(0, EYE, 12);
    for (let i = 0; i < 20; i++) spawnItem({ di: pickDef(), id: 'i' + i });
  } else {

    scene.background = new THREE.Color(0xcfd8dc);
    scene.fog = new THREE.Fog(0xcfd8dc, 25, 70);
    groundMat.color.set(0xc9a27a);

    ? 'WASD: Move | SPACE: Jump | CLICK: Pick up / drop in bin | SCROLL: Zoom 1st/3rd person | ESC: Menu'
    : 'WASD: Move | SPACE: Jump | HOLD CLICK: Vacuum | 1/2/3: Switch vacuum | SCROLL: Zoom 1st/3rd person | ESC: Menu';

// ---------- Mode 1 interaction ----------
function flatDist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

function interactEco() {
  if (!held) {
    let best = null, bd = 4;
    for (const it of items) {
      const d = flatDist(camera.position, it.group.position);
      if (d < bd) { bd = d; best = it; }
    }
    if (best) {
      held = best;
      items.splice(items.indexOf(best), 1);
      best.label.visible = false;
      camera.add(best.group);
      best.group.scale.setScalar(best.h > 1 ? 0.35 : 0.8);
      best.group.position.set(0.55, -0.55, -1.3);
      best.body.rotation.set(0.2, 0.6, 0);
      updateHUD();
    }
  } else {
    let best = null, bd = 4.5;
    for (const b of bins) {
      const d = flatDist(camera.position, b.pos);
      if (d < bd) { bd = d; best = b; }
    }
    if (best) {
      if (best.type === held.def.bin) {
        const gain = held.def.crazy ? 3 : 1;
        score += gain; flash('Correct! +' + gain, '#7CFC9A');
      } else {
        score = Math.max(0, score - 1);
        flash('Nope! ' + held.def.name + ' goes in the ' + BIN_TYPES[held.def.bin].label, '#ff6b6b');
      }
      camera.remove(held.group);
      held = null;
      setTimeout(() => { if (mode === 1) { spawnItem(null, true); updateHUD(); } }, 1500);
      updateHUD();
    }
  }
}

// ---------- Mode 2 vacuum ----------
const _fwd = new THREE.Vector3(), _to = new THREE.Vector3(), _src = new THREE.Vector3();
function updateVacuum(dt) {
  suction.visible = vacOn;
  if (vacOn) {
    suction.scale.setScalar(1 + Math.sin(performance.now() / 60) * 0.04);
    camera.getWorldDirection(_fwd);
    _src.copy(camera.position); _src.y -= 0.4;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      _to.copy(it.group.position); _to.y += it.h * 0.5; _to.sub(_src);
      const dist = _to.length();
      if (itemCat(it.def) !== vacTypes[vacIdx].cat) {
        if (dist < 3 && performance.now() - lastHint > 2500) {
          lastHint = performance.now();
          const k = vacTypes.findIndex(v => v.cat === itemCat(it.def));
          flash('Wrong vacuum! Press ' + (k + 1) + ' for the ' + vacTypes[k].name, '#ffffff');
        }
        continue;
      }
      if (dist < 1.3) {
        score += it.def.pts;
        flash('+' + it.def.pts + ' ' + it.def.name + (it.def.crazy ? '!!' : ''), it.def.crazy ? '#ffd740' : '#80d8ff');
        scene.remove(it.group); items.splice(i, 1);
        setTimeout(() => { if (mode === 2 && !ended) spawnItem(null, true); }, 800);
        continue;
      }
      _to.divideScalar(dist);
      if (dist < 9 && _to.dot(_fwd) > 0.8) {
        const speed = (13 / it.def.mass) * (1 + (9 - dist) / 9);
        it.group.position.addScaledVector(_to, -speed * dt);
        it.body.rotation.y += dt * 10;
        it.pulled = true;
      }
    }
  }
  // items fall back to the floor when not being sucked
  for (const it of items) {
    if (!it.pulled && it.group.position.y > 0) it.group.position.y = Math.max(0, it.group.position.y - 9 * dt);
    it.pulled = false;
  }
}

const keys = {};
let fallback = false; // used when the browser blocks mouse lock
function enableFallback() {
  if (fallback || document.pointerLockElement) return;
  fallback = true;
  overlay.style.display = 'none';
  flash('Mouse lock blocked - use ARROW KEYS to look around', '#ffffff');
}
function lock() {
  fallback = false;
  if (mobile) { fallback = true; overlay.style.display = 'none'; return; }
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(enableFallback);
  } catch (e) { enableFallback(); }
  setTimeout(() => { if (!document.pointerLockElement) enableFallback(); }, 700);
}
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  if (e.code === 'Escape' && fallback) { fallback = false; vacOn = false; showMenu(started ? 'Paused' : null); }
});
addEventListener('keyup', e => keys[e.code] = false);

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement) overlay.style.display = 'none';
  else { vacOn = false; if (!ended) showMenu(started ? 'Paused' : null); }
});
addEventListener('mousemove', e => {
  if (!document.pointerLockElement) return;
  camera.rotation.y -= e.movementX * 0.002;
  camera.rotation.x -= e.movementY * 0.002;
  camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
});
addEventListener('mousedown', () => {
  if (mobile) return;
  if (!(document.pointerLockElement || fallback)) return;
  if (mode === 1) interactEco();
  else if (mode === 2) vacOn = true;
});
addEventListener('mouseup', () => { vacOn = false; });

let vy = 0, onGround = true;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const locked = !!document.pointerLockElement || fallback;

  if (locked && mode) {
    if (keys.ArrowLeft) camera.rotation.y += 2 * dt;
    if (keys.ArrowRight) camera.rotation.y -= 2 * dt;
    if (keys.ArrowUp) camera.rotation.x = Math.min(1.4, camera.rotation.x + 1.5 * dt);
    if (keys.ArrowDown) camera.rotation.x = Math.max(-1.4, camera.rotation.x - 1.5 * dt);
    const speed = 7;
    const yaw = camera.rotation.y;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3();
    if (keys.KeyW) move.add(fwd);
    if (keys.KeyS) move.sub(fwd);
    if (keys.KeyD) move.add(right);
    if (keys.KeyA) move.sub(right);
    if (Math.hypot(joy.x, joy.y) > 0.15) { move.addScaledVector(fwd, -joy.y); move.addScaledVector(right, joy.x); }
    if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed * dt);
    camera.position.add(move);
    camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
    camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));

    if (keys.Space && onGround) { vy = 7; onGround = false; }
    vy -= 20 * dt;
    camera.position.y += vy * dt;
    if (camera.position.y <= EYE) { camera.position.y = EYE; vy = 0; onGround = true; }

    if (mode === 2 && !ended) {
      if (timed) timeLeft -= dt;
      updateVacuum(dt);
      updateHUD();
      if (timed && timeLeft <= 0) endGame();
    }
  }

  // spin items (unless being sucked) so they're easy to spot
  if (mode) for (const it of items) if (!it.pulled) it.body.rotation.y += dt * 0.8;

  if (mode) {
    if (!selfAv || selfAv.userData.kind !== avIdx || selfAv.userData.name !== pname) {
      if (selfAv) scene.remove(selfAv);
      selfAv = buildAvatar(avIdx);
      selfAv.userData.kind = avIdx; selfAv.userData.name = pname;
      const tg = makeLabel(pname, false); tg.position.y = 2.5; selfAv.add(tg);
      scene.add(selfAv);
    }
    camDist += (camTarget - camDist) * 0.15;
    selfAv.visible = camDist > 0.7;
    selfAv.position.set(camera.position.x, camera.position.y - EYE, camera.position.z);
    selfAv.rotation.y = camera.rotation.y + Math.PI;
    const op = camera.position.clone(), dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    camera.position.addScaledVector(dir, -camDist);
    camera.position.y = Math.max(camera.position.y + camDist * 0.18, camDist > 0.7 ? 0.5 : 0);
    camera.position.x = Math.max(-limit - 1, Math.min(limit + 1, camera.position.x));
    camera.position.z = Math.max(-limit - 1, Math.min(limit + 1, camera.position.z));
    renderer.render(scene, camera);
    camera.position.copy(op);
  } else {
    if (selfAv) selfAv.visible = false;
    renderer.render(scene, camera);
  }
}

let mobile = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches;

function buildAvatar(kind) {
  const g = new THREE.Group();
  const col = [0x9e9e9e, 0xff9800, 0xd7a35a][kind] || 0x9e9e9e;
  const body = M(new THREE.SphereGeometry(0.5, 14, 12), col); body.scale.y = 1.3; part(g, body, 0, 0.7, 0);
  part(g, M(new THREE.SphereGeometry(0.38, 14, 12), col), 0, 1.6, 0);
  [-0.12, 0.12].forEach(x => part(g, M(new THREE.SphereGeometry(0.06, 8, 6), 0x111111), x, 1.65, 0.34));
  if (kind === 0) {
    [-0.32, 0.32].forEach(x => { const e = M(new THREE.CylinderGeometry(0.22, 0.22, 0.06, 14), 0xf8bbd0); e.rotation.x = Math.PI / 2; part(g, e, x, 1.9, 0); });
    part(g, M(new THREE.SphereGeometry(0.07, 8, 6), 0xf06292), 0, 1.58, 0.38);
  } else if (kind === 1) {
    [-0.22, 0.22].forEach(x => part(g, M(new THREE.ConeGeometry(0.14, 0.3, 4), col), x, 1.95, 0));
    part(g, M(new THREE.SphereGeometry(0.06, 8, 6), 0xf06292), 0, 1.55, 0.38);
  } else {
    part(g, M(new THREE.SphereGeometry(0.45, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), 0xe0a050), 0, 1.85, 0);
    part(g, M(new THREE.CylinderGeometry(0.46, 0.46, 0.12, 14), 0x5d4037), 0, 1.82, 0);
  }
  const tail = M(new THREE.CylinderGeometry(0.04, 0.04, 0.9, 6), kind === 0 ? 0xf8bbd0 : col);
  tail.rotation.x = Math.PI / 2.5; part(g, tail, 0, 0.5, -0.65);
  return g;
}

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === lookId) {
    camera.rotation.y -= (t.clientX - lx) * 0.006;
    camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - (t.clientY - ly) * 0.006));
    lx = t.clientX; ly = t.clientY;
  }
}, { passive: false });
const lEnd = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
cv.addEventListener('touchend', lEnd); cv.addEventListener('touchcancel', lEnd);

setInterval(() => {
  tUI.style.display = (mobile && mode && overlay.style.display === 'none') ? 'block' : 'none';
  vacBtns.forEach(b => b.style.display = mode === 2 ? 'flex' : 'none');
  aBtn.textContent = mode === 2 ? 'SUCK' : (held ? 'DROP' : 'GRAB');
  document.getElementById('controls').style.display = mobile ? 'none' : 'block';
}, 150);

scene.background = new THREE.Color(0x9fd8ff);
showMenu();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
